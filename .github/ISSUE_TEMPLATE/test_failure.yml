name: Test failure report
description: Report a failing E2E test with CI context
title: "[Test failure]: "
labels:
  - test-failure
body:
  - type: markdown
    attributes:
      value: |
        Use this template when a Playwright test fails and you want to track the fix.
        Latest public report: https://mehedimohammad213.github.io/Playwite-practice-with-Docker-and-CI-CD/

  - type: input
    id: scenario
    attributes:
      label: Failing scenario
      description: Feature file or scenario name
      placeholder: kto-cms-login.feature — Login, navigate admin sections, and logout
    validations:
      required: true

  - type: input
    id: workflow-run
    attributes:
      label: GitHub Actions run URL
      placeholder: https://github.com/mehedimohammad213/Playwite-practice-with-Docker-and-CI-CD/actions/runs/123
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chromium
        - Firefox
        - WebKit
        - Multiple
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Paste the failure message from Playwright or CI logs
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Triage checklist
      options:
        - label: I checked the public HTML report
        - label: I downloaded traces from CI artifacts
        - label: The failure reproduces locally
