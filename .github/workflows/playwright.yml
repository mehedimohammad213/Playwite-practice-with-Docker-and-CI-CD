name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install -g pnpm && pnpm install
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Run Playwright tests
      run: pnpm test
      env:
        CI: true
    - name: Setup Java for Allure
      if: always()
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
    - name: Generate Allure report
      if: always()
      run: pnpm run allure:generate
    - name: Prepare public report site
      if: always()
      run: |
        if [ ! -d allure-report ]; then
          echo "No allure-report directory found, skipping public site prep."
          exit 0
        fi
        mkdir -p public
        cp -r allure-report/* public/
        (cd allure-report && zip -r ../public/allure-report.zip .)
    - name: Upload Allure report
      id: allure-report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
        if-no-files-found: ignore
    - name: Upload test results (traces & screenshots)
      id: test-results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        retention-days: 30
        if-no-files-found: ignore
    - name: Upload public report for GitHub Pages
      if: always() && github.event_name == 'push' && hashFiles('public/index.html') != ''
      uses: actions/upload-pages-artifact@v3
      with:
        path: public
    - name: Add download buttons to job summary
      if: always()
      run: |
        PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        {
          echo "## Test artifacts"
          echo ""
          if [ "${{ github.event_name }}" = "push" ] && [ -f public/index.html ]; then
            echo "### Public links (no login required)"
            echo ""
            echo "[![View Public Report](https://img.shields.io/badge/View-Public%20Report-2ea44f?style=for-the-badge&logo=allure&logoColor=white)](${PAGES_URL}/)"
            echo "[![Download Public Report](https://img.shields.io/badge/Download-Public%20Report-0969da?style=for-the-badge&logo=download&logoColor=white)](${PAGES_URL}/allure-report.zip)"
            echo ""
            echo "Anyone can open or download the latest Allure report from GitHub Pages."
            echo ""
          fi
          echo "### GitHub Actions artifacts (login required)"
          echo ""
          if [ -n "${{ steps.allure-report.outputs.artifact-id }}" ]; then
            echo "[![Download Allure Report](https://img.shields.io/badge/Download-Allure%20Report-2ea44f?style=for-the-badge&logo=allure&logoColor=white)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.allure-report.outputs.artifact-id }})"
            echo ""
          fi
          if [ -n "${{ steps.test-results.outputs.artifact-id }}" ]; then
            echo "[![Download Test Results](https://img.shields.io/badge/Download-Test%20Results-d73a49?style=for-the-badge&logo=githubactions&logoColor=white)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.test-results.outputs.artifact-id }})"
            echo ""
            echo "Contains traces, screenshots, and videos from failed or retried tests."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

  deploy-report:
    needs: test
    if: github.event_name == 'push' && always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy public report to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  create-issue:
    needs: test
    if: >-
      always() &&
      needs.test.result == 'failure' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Create or update GitHub issue for test failure
      uses: actions/github-script@v7
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          const pagesUrl = `https://${owner}.github.io/${repo}/`;
          const shortSha = context.sha.slice(0, 7);
          const title = `[CI] Playwright tests failed (run #${context.runNumber})`;

          async function ensureLabel(name, color, description) {
            try {
              await github.rest.issues.getLabel({ owner, repo, name });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }
          }

          await ensureLabel('test-failure', 'd73a49', 'Playwright test failure tracked from CI');
          await ensureLabel('automated', 'ededed', 'Created automatically by GitHub Actions');

          const body = [
            '## Test failure',
            '',
            'Playwright tests failed on `' + context.ref + '`.',
            '',
            '| | |',
            '|---|---|',
            `| **Workflow run** | [View run #${context.runNumber}](${runUrl}) |`,
            `| **Public report** | [View report](${pagesUrl}) |`,
            `| **Download report** | [allure-report.zip](${pagesUrl}allure-report.zip) |`,
            `| **Commit** | \`${shortSha}\` |`,
            `| **Triggered by** | @${context.actor} |`,
            '',
            '### Next steps',
            '- [ ] Review the [Allure report](' + pagesUrl + ')',
            '- [ ] Download traces from the workflow artifacts',
            '- [ ] Fix failing tests and push again',
          ].join('\n');

          const { data: issues } = await github.rest.issues.listForRepo({
            owner,
            repo,
            labels: 'test-failure',
            state: 'open',
          });

          if (issues.length > 0) {
            const issue = issues[0];
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                'Tests failed again in run',
                `[#${context.runNumber}](${runUrl})`,
                `on \`${shortSha}\` by @${context.actor}.`,
                '',
                `[View report](${pagesUrl})`,
              ].join(' '),
            });
            core.info(`Commented on existing issue #${issue.number}`);
          } else {
            const { data: issue } = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['test-failure', 'automated'],
            });
            core.info(`Created issue #${issue.number}`);
          }
