name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install -g pnpm && pnpm install
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Run Playwright tests
      run: pnpm test
      env:
        CI: true
    - name: Upload Playwright HTML report
      id: playwright-report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        if-no-files-found: ignore
    - name: Upload test results (traces & screenshots)
      id: test-results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        retention-days: 30
        if-no-files-found: ignore
    - name: Add download buttons to job summary
      if: always()
      run: |
        {
          echo "## Test artifacts"
          echo ""
          if [ -n "${{ steps.playwright-report.outputs.artifact-id }}" ]; then
            echo "[![Download Playwright Report](https://img.shields.io/badge/Download-Playwright%20Report-2ea44f?style=for-the-badge&logo=playwright&logoColor=white)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.playwright-report.outputs.artifact-id }})"
            echo ""
            echo "Unzip the downloaded file and open \`index.html\` in your browser."
            echo ""
          fi
          if [ -n "${{ steps.test-results.outputs.artifact-id }}" ]; then
            echo "[![Download Test Results](https://img.shields.io/badge/Download-Test%20Results-d73a49?style=for-the-badge&logo=githubactions&logoColor=white)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.test-results.outputs.artifact-id }})"
            echo ""
            echo "Contains traces, screenshots, and videos from failed or retried tests."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
