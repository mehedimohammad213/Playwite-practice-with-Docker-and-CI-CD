name: Feature request
description: Suggest a new test scenario or improvement to the suite
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the test coverage or tooling improvement you would like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: What is missing from the current test suite?
      placeholder: We do not cover subscription cancellation flow
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the new scenario or feature work?
      placeholder: Add a Gherkin scenario that logs in, opens Subscription, and verifies cancel action
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
